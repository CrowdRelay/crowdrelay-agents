# Agent service production compose — deploy alongside the control plane.
#
# This file is an overlay for the control plane stack. Deploy with:
#   docker compose -f compose.production.yml -f compose.area.yml -f compose.agents.yml up -d
#
# The agent service joins the control plane's internal network (so the
# control plane can reach it at http://agent-service:8095) and the
# crowdrelay-shared network (so it can query the crowdrelay Postgres).
#
# Required env vars (add to /srv/crowdrelay-control-plane/.env):
#   AGENT_SERVICE_AUTH_KEY — must match CONTROL_PLANE_MANAGEMENT_MASTER_KEY
#   AGENT_SERVICE_ENCRYPTION_KEY — 64 hex chars (generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
#   CROWDRELAY_DB_PASSWORD — the crowdrelay postgres password
#
# Optional env vars:
#   OPENCODE_ZEN_TOKEN — free LLM token
#   GOOGLE_API_KEY — platform-level Google fallback
#   GROQ_API_KEY — platform-level Groq fallback
#   REDDIT_SCRAPER_QUERIES — comma-separated subreddit search queries for the scraper ticker
#   REDDIT_SCRAPER_ENABLED — "false" to disable the Reddit scrape ticker (default: true)
#   REDDIT_PAGE_TIMEOUT_MS — navigation budget in ms (default: 300000). Raise it
#     when the host is slow; a login that times out burns all three attempts and
#     marks working credentials invalid, so this is worth being generous with.
#   REDDIT_SESSION_PROBE_TIMEOUT_MS — session-probe budget in ms (default: 120000)

services:
  agent-service:
    image: crowdrelay-agents:${AGENT_SERVICE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      AGENT_SERVICE_BIND: "0.0.0.0:8095"
      DATABASE_URL: "postgres://crowdrelay:${CROWDRELAY_DB_PASSWORD}@crowdrelay-db:5432/crowdrelay"
      AGENT_SERVICE_AUTH_KEY: "${AGENT_SERVICE_AUTH_KEY:?AGENT_SERVICE_AUTH_KEY required}"
      AGENT_SERVICE_ENCRYPTION_KEY: "${AGENT_SERVICE_ENCRYPTION_KEY:?AGENT_SERVICE_ENCRYPTION_KEY required}"
      REDDIT_BROWSER_PROFILE_DIR: "/data/reddit-browser-profile"
      REDDIT_SCRAPER_ENABLED: "${REDDIT_SCRAPER_ENABLED:-true}"
      REDDIT_SCRAPER_QUERIES: "${REDDIT_SCRAPER_QUERIES:-}"
      REDDIT_PAGE_TIMEOUT_MS: "${REDDIT_PAGE_TIMEOUT_MS:-}"
      REDDIT_SESSION_PROBE_TIMEOUT_MS: "${REDDIT_SESSION_PROBE_TIMEOUT_MS:-}"
      OPENCODE_ZEN_TOKEN: "${OPENCODE_ZEN_TOKEN:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      RUST_LOG: "${RUST_LOG:-info}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8095/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    # Playwright/Chromium needs more memory than a pure API service.
    mem_limit: 512m
    cpus: 1.0
    # read_only is relaxed because Playwright writes to the profile directory.
    read_only: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - agent-browser-state:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - crowdrelay-shared

  app:
    environment:
      CONTROL_PLANE_AGENT_SERVICE_URL: "http://agent-service:8095"

volumes:
  agent-browser-state:

networks:
  crowdrelay-shared:
    external: true
    name: crowdrelay-shared
