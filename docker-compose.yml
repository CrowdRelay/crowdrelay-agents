services:
  agent-service:
    build: .
    ports:
      - "127.0.0.1:8095:8095"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://crowdrelay:crowdrelay-local-only@crowdrelay-postgres-1:5432/crowdrelay"
    volumes:
      - agent-browser-data:/app/data
    networks:
      - default
      - crowdrelay
    restart: unless-stopped

volumes:
  agent-browser-data:

networks:
  crowdrelay:
    external: true
    name: crowdrelay_default
